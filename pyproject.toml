[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mriforge"
version = "0.3.0"
authors = [{ name = "Eisa Hedayati" }]
description = "CMRR MRI Processing Libraries"
readme = "README.md"

requires-python = ">=3.10"

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: Other/Proprietary License",
]
license = { file = "LICENSE" }

# Lightweight dependencies needed by the core numerical functionality.
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "tqdm>=4.66",
]

[project.scripts]
mriforge-dicom-to-nifti = "mrif.cli.dicom_to_nifti:main"
mriforge-t2star = "mrif.cli.t2star:main"

[project.optional-dependencies]

# DICOM / NIfTI / HDF5 I/O
io = [
    "h5py>=3.11",
    "nibabel>=5.2,<6",
    "pydicom>=2.4,<4",
    "SimpleITK>=2.3",
]

# DataFrame-related utilities
data = [
    "pandas>=2.1,<4",
]

# Plotting and interactive visualization
viz = [
    "matplotlib>=3.8",
    "ipywidgets>=8.1",
    "ipython>=8.20",
]

# PyTorch-based reconstruction and quantitative MRI
torch = [
    "torch>=2.2",
]

# Segmentation functionality
seg = [
    "torch>=2.2",
    "monai>=1.3,<2",
]

# Everything needed for all MRIForge functionality
all = [
    "h5py>=3.11",
    "pandas>=2.1,<4",
    "nibabel>=5.2,<6",
    "pydicom>=2.4,<4",
    "matplotlib>=3.8",
    "torch>=2.2",
    "SimpleITK>=2.3",
    "dicom2nifti>=2.4",
    "monai>=1.3,<2",
    "ipywidgets>=8.1",
    "ipython>=8.20",
]

# Development / testing tools
dev = [
    "pytest>=8",
    "ruff>=0.4.8",
    "build",
    "twine",
]